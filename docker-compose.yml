services:
  postgres:
    image: postgres:16-alpine
    container_name: wcu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wcu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wcu_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-wcu_trade}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wcu}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wcu-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wcu-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wcu}:${POSTGRES_PASSWORD:-wcu_dev_password}@postgres:5432/${POSTGRES_DB:-wcu_trade}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - '4000:4000'
    # On boot: apply migrations, seed (idempotent), then start.
    command: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts || true; node dist/main.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: wcu-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  pgdata:
