# WCU TRADE — Render Blueprint (single service, no Docker)
# The API also serves the built React app, so ONE web service hosts the whole platform.
# Deploy: Render → New → Blueprint → connect this repo → Apply, then set DATABASE_URL.
# Render allows only ONE free Postgres/account, so this blueprint does NOT create the DB —
# set DATABASE_URL yourself (reuse an existing Render Postgres, ideally with ?schema=wcu).

services:
  - type: keyvalue
    name: wcu-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: wcu-trade
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Postgres Internal URL (append ?schema=wcu to isolate tables)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wcu-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MARKET_DATA_PROVIDER
        value: binance
