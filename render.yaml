# WCU TRADE — Render Blueprint
# Deploy: Render Dashboard → New → Blueprint → connect this repo → Apply.
# Provisions PostgreSQL + Redis (Key Value) + the API (Docker) + the web (static SPA).
# Free plans; the API seeds demo data on first deploy (logins: *@wcu.edu / Passw0rd!).

databases:
  - name: wcu-postgres
    plan: free
    databaseName: wcu_trade
    user: wcu

services:
  # ---- Redis (Key Value) ----
  - type: keyvalue
    name: wcu-redis
    plan: free
    ipAllowList: [] # internal access only
    maxmemoryPolicy: noeviction

  # ---- API (NestJS, Docker) ----
  - type: web
    name: wcu-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Apply migrations + (idempotent) seed, then start.
    dockerCommand: sh -c "npx prisma migrate deploy && npx ts-node prisma/seed.ts || true; node dist/main.js"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wcu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wcu-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MARKET_DATA_PROVIDER
        value: binance
      - key: CORS_ORIGINS
        value: "*" # Bearer-token auth (no cookies); reflecting origins is safe here

  # ---- Web (React SPA, static) ----
  - type: web
    name: wcu-web
    runtime: static
    buildCommand: npm install && npm run build:shared && npm run build --workspace @wcu/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: wcu-api
          property: host # bare host; the web prefixes https:// (see src/lib/env.ts)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
